<app-home-keyart />


<div class="anim-wrapper" appReveal="fade-up" [revealDuration]="1500">
  <app-home-feature
    header="Front-End Development"
    color="red"
    image=""
    [isAlternate]="false"
    [stack]="frontendFeatures"
  >
    @if (content()) {
      {{ getContentBody(content(), 'frontend') }}
    }
  </app-home-feature>
</div>

<div class="anim-wrapper" appReveal="fade-up" [revealDuration]="1500">
  <app-home-feature
    header="Back-End Development"
    content=""
    color="blue"
    image=""
    [isAlternate]="true"
    [stack]="backendFeatures"
  >
    @if (content()) {
      {{ getContentBody(content(), 'backend') }}
    }
  </app-home-feature>
</div>

<div class="anim-wrapper" appReveal="fade-up" [revealDuration]="1500">
  <app-home-feature
    header="Everything Development"
    content=""
    color="pink"
    image=""
    [isAlternate]="false"
    [stack]="otherFeatures"
  >
    @if (content()) {
      {{ getContentBody(content(), 'general') }}
    }
  </app-home-feature>
</div>
