<div class="frames">
  @for (image of images(); track image.src; let i = $index) {
    <img
      [src]="image.src"
      [alt]="image.alt"
      [class.current]="i === index()"
      [attr.aria-hidden]="i !== index()"
      loading="lazy"
    />
  }
</div>

@if (images().length > 1) {
  <button type="button" (click)="paused.set(!paused())">
    {{ paused() ? "Play slideshow" : "Pause slideshow" }}
  </button>
}
