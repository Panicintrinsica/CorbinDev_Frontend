<div class="feature-segment" [class.alt]="card().isAlternate" [class.has-media]="card().images.length">
  <div class="card-slot" [class.offstage]="foil.armed() && !foil.entered()">
    <app-foil-card #foil="foilCard" [theme]="theme()">
      <h1
        [class]="card().color"
        class="heavy text-gradient"
        [style.background-image]="
          card().color === 'custom'
            ? 'linear-gradient(66deg, ' + theme().foil[1] + ', ' + theme().foil[2] + ')'
            : null
        "
      >{{ card().title }}</h1>

      <div class="text body">{{ card().body }}</div>

      @if (card().route) {
        <a
          class="featured-button {{ card().color }}"
          [routerLink]="card().route"
          [style.color]="card().color === 'custom' ? theme().foil[2] : null"
          [style.border-color]="card().color === 'custom' ? theme().foil[1] : null"
        >More</a>
      }

      <div #logos class="stack" [class.dissolved]="dissolved()">
        @for (item of card().logos; track item.skillId) {
          <button
            type="button"
            class="logo"
            aria-haspopup="dialog"
            [style.--order]="$index"
            (click)="viewSkill(item.skillId)"
          >
            @if (item.src) {
              <img [src]="item.src" height="48" width="48" [alt]="item.name">
            } @else {
              <span class="name">{{ item.name }}</span>
            }
          </button>
        }
      </div>
    </app-foil-card>
  </div>

  @if (card().images.length) {
    <app-feature-gallery class="media" [images]="card().images" />
  }
</div>
