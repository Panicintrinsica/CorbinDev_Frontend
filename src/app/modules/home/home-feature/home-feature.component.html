<div class="feature-segment" [class.alt]="isAlternate" [class.has-media]="images.length">
  <div class="card-slot" [class.offstage]="card.armed() && !card.entered()">
    <app-foil-card #card="foilCard" [theme]="theme ?? themes[color]">
      <h1 [class]="color" class="heavy text-gradient">{{ header }}</h1>

      <div class="text">
        <ng-content></ng-content>
      </div>

      @if (route) {
        <a class="featured-button {{ color }}" [routerLink]="route">More</a>
      }

      <div class="stack" [class.dissolved]="card.armed() && !card.revealed()">
        @for (item of stack; track item.img) {
          <a [href]="item.link" target="_blank" rel="noopener" [style.--order]="$index">
            <img class="skillLogo" ngSrc="assets/brands/{{ item.img }}.svg" height="48" width="48" alt="{{ item.alt }}">
          </a>
        }
      </div>
    </app-foil-card>
  </div>

  @if (images.length) {
    <app-feature-gallery class="media" [images]="images" />
  }
</div>
